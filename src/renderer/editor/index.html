<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>ShotKit Editor</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="group" id="tools"></div>
      <div class="sep"></div>
      <div class="group" id="colors"></div>
      <div class="sep"></div>
      <div class="group" id="sizes"></div>
      <button id="fill" class="tool" title="Filled shapes (F)"></button>
      <div class="sep"></div>
      <button id="undo" class="tool" title="Undo (Ctrl+Z)"></button>
      <button id="redo" class="tool" title="Redo (Ctrl+Y)"></button>
      <div class="spacer"></div>
      <button id="bgToggle" class="tool wide" title="Background & padding"></button>
      <div class="sep"></div>
      <div class="group actions">
        <button data-export="pin" class="btn ghost" title="Pin to screen">Pin</button>
        <button data-export="saveAs" class="btn ghost" title="Save As (Ctrl+Shift+S)">Save As…</button>
        <button data-export="copy" class="btn" title="Copy (Ctrl+C)">Copy</button>
        <button data-export="save" class="btn primary" title="Save (Ctrl+S)">Save</button>
      </div>
    </header>
    <div id="main">
      <div id="stage">
        <canvas id="canvas"></canvas>
        <textarea id="textInput" hidden spellcheck="false" rows="1"></textarea>
        <div id="cropBar" hidden>
          <span id="cropSize"></span>
          <button id="cropReset" class="btn ghost">Reset</button>
          <button id="cropCancel" class="btn ghost">Cancel</button>
          <button id="cropApply" class="btn primary">Apply crop</button>
        </div>
      </div>
      <aside id="bgPanel" hidden>
        <h3>Background</h3>
        <label class="check"><input type="checkbox" id="bgEnabled" /> Show background</label>
        <div id="bgSwatches"></div>
        <label class="slider">Padding <input type="range" id="bgPadding" min="0" max="200" /></label>
        <label class="slider">Corner radius <input type="range" id="bgRadius" min="0" max="48" /></label>
        <label class="check"><input type="checkbox" id="bgShadow" /> Drop shadow</label>
      </aside>
    </div>
    <div id="toast"></div>
    <script src="editor.js"></script>
  </body>
</html>
